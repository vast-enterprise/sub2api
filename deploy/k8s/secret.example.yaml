# sub2api runtime Secret —— 复制为真实值后创建，切勿提交真实凭据。
# 推荐用命令式创建（见 k8s/README.md），此文件仅作字段参考。
#
#   kubectl -n sub2api create secret generic sub2api-env --from-env-file=.env
#
# ⚠️ JWT_SECRET 与 TOTP_ENCRYPTION_KEY 必须固定且长期不变：
#    留空会在每次 Pod 启动时随机生成，导致所有登录会话失效、2FA 全部作废。
#    生成：openssl rand -hex 32
apiVersion: v1
kind: Secret
metadata:
  name: sub2api-env
  namespace: sub2api
type: Opaque
stringData:
  # ===== 数据库（复用已有 PostgreSQL 服务，晚点填入）=====
  DATABASE_HOST: your-pg-host
  DATABASE_PORT: "5432"
  DATABASE_USER: sub2api
  DATABASE_PASSWORD: your-pg-password
  DATABASE_DBNAME: sub2api
  # RDS 通常要求 require/verify-full；集群内自建可用 disable
  DATABASE_SSLMODE: require

  # ===== Redis（复用已有 Redis 服务，晚点填入）=====
  REDIS_HOST: your-redis-host
  REDIS_PORT: "6379"
  REDIS_PASSWORD: your-redis-password
  REDIS_DB: "0"
  REDIS_ENABLE_TLS: "false"

  # ===== 固定密钥（必须持久不变，见文件顶部说明）=====
  JWT_SECRET: replace-with-openssl-rand-hex-32
  TOTP_ENCRYPTION_KEY: replace-with-openssl-rand-hex-32

  # ===== 首次启动自动创建的管理员账号 =====
  ADMIN_EMAIL: admin@sub2api.local
  ADMIN_PASSWORD: replace-with-strong-password
