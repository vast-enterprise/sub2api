apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sub2api
  namespace: sub2api
  labels:
    app.kubernetes.io/name: sub2api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sub2api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
        - type: Pods
          value: 2
          periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
